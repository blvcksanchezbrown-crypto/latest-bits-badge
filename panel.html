<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="panel.js" defer></script>

  <title>STEEEL Media Redeems</title>

  <style>
    body {
      margin: 0;
      background: #00000c;
      color: white;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      padding: 12px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #48c9d0, #051070 85%);
      border-radius: 10px;
    }

    .title {
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      margin: 6px 0 14px;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .card {
      background: #0f5fdc;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .card img {
      width: 100%;
      height: 126px;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .card-footer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      background: #115be6;
    }

    .card-title {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .card-user {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 3px;
      text-transform: none;
    }

    .bits {
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
      color: #ffffff;
    }

    .bits::before {
      content: "◇ ";
      color: #ffffff;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="title">LATEST CHEERS</div>
    <div id="mediaCards"></div>
  </div>
</body>
</html>
